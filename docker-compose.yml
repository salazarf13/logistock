services:
  db:
    image: postgis/postgis:16-3.4
    container_name: logistock-db
    environment:
      POSTGRES_USER: logistock
      POSTGRES_PASSWORD: logistock
      POSTGRES_DB: logistock
    ports:
      - "5433:5432"
    volumes:
      - logistock_pg:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistock -d logistock"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  logistock_pg:
